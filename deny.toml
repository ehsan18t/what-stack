[advisories]
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.93
# Keep this list to licenses the dependency graph actually uses; cargo-deny
# warns about unmatched entries. Adding a license needs maintainer approval.
allow = [
  "MIT",
  "Apache-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = []
deny = [
  { crate = "openssl", use-instead = "rustls" },
  { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
