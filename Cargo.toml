[package]
name = "what-stack"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
autobenches = false
authors = ["Ehsan Khan"]
description = "Detect project roots and technology stacks from container image names, project config files, and process names"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ehsan18t/what-stack"
documentation = "https://docs.rs/what-stack"
keywords = ["detection", "framework", "stack", "project", "docker"]
categories = ["development-tools", "filesystem"]
include = ["src/**", "LICENSE", "README.md", "CHANGELOG.md"]

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
gungraun = "0.18.2"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[profile.bench]
debug = true

[[bench]]
name = "benchmarks"
harness = false
test = false
